name: Extract MedCore HMS ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/medcore
          unzip -o MedCore-HMS-GitHub-Ready.zip -d /tmp/medcore
          find /tmp/medcore -name package.json -print

      - name: Copy project files
        run: |
          SOURCE=$(find /tmp/medcore -name pnpm-workspace.yaml -print -quit)
          if [ -z "$SOURCE" ]; then
            echo "Project folder not found in ZIP"
            exit 1
          fi
          ROOT=$(dirname "$SOURCE")
          cp -an "$ROOT"/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Add complete MedCore HMS project"
          git push
